<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 - Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 50px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 380px;
      width: 90%;
    }
    .code { font-size: 5rem; font-weight: 800; color: #4f6ef7; line-height: 1; }
    h2 { font-size: 1.3rem; color: #222; margin: 12px 0 8px; }
    p  { font-size: 0.88rem; color: #888; margin-bottom: 28px; }
    a  {
      display: inline-block;
      padding: 10px 28px;
      background: #4f6ef7;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover { background: #3a57e8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">← Back to Login</a>
  </div>
</body>
</html>
